indexpage:
  title: Keystoneドキュメント
  summary: Keystone STaaSは、従量課金制モデルを通じてファイル、ブロック、およびオブジェクトストレージサービスを提供する、NetApp Keystoneプラットフォームのサブスクリプションサービスです。
  keywords: NetApp Keystone, Keystone STaaS, storage as a service, subscription
  lead: NetApp Keystoneは、NetAppのストレージ・アズ・ア・サービス・プラットフォームです。Keystoneのサブスクリプション製品であるKeystone
    Storage-as-a-Service（STaaS）は、従量課金制モデルを通じてファイル、ブロック、およびオブジェクトストレージサービスを提供します。Keystone
    STaaSを利用することで、組織は初期の設備投資を行うのではなく、運用コストとしてストレージを利用できるようになります。
